name: build
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: src-tauri/target/release/bundle/